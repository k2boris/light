# Blackbox Java runtime configuration for the BIAN KYC slice.
#
# Project-scoped paths keep BIAN data, logs, and reverse test outputs separate
# from TMF while reusing the common Java runtime core.

logging.level=INFO

source.MDM_INFA_DS.url=jdbc:sqlite:../../../tests/k2/databases/INFA-mdm.db
source.CRM_SF_DS.url=jdbc:sqlite:../../../tests/k2/databases/SF-crm.db
source.AML_ORA_DS.url=jdbc:sqlite:../../../tests/k2/databases/ORA-aml.db
source.CORE_TMNS_DS.url=jdbc:sqlite:../../../tests/k2/databases/TMNS-core.db
source.DOWJONES_DS.url=jdbc:sqlite:../../../tests/k2/databases/DOWJONES-feed.db

target.outputDir=../../../tmp/java-runtime/data
target.schema=../../../metadata/BIAN-Canonical-ddl.sql
target.overwrite=true

reverse.outputDir=../../../tmp/java-runtime/reverse-sources
reverse.report=../../../tmp/java-runtime/reverse-compare.json

# Empty or <= 0 means no limit. Set to a small value for quick local smoke runs.
runtime.maxInstances=
