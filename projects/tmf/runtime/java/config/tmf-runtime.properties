# Blackbox Java runtime configuration for the first TMF slice.
#
# This file is intentionally kept at the top of the Java implementation so a
# runtime operator can see the database paths and logging level without reading
# generated mapping code.

# java.util.logging level. Supported useful values:
# INFO, FINE, FINER, FINEST.
logging.level=INFO

# Source systems used by the current generated TMF mappings.
source.SIEBEL_SYSTEM.url=jdbc:sqlite:../../../tests/k2/databases/siebel.db
source.BSCS_SYSTEM.url=jdbc:sqlite:../../../tests/k2/databases/bscs.db
source.NCC_SYSTEM.url=jdbc:sqlite:../../../tests/k2/databases/ncc.db

# Each TC_PARTY instance gets its own target SQLite database under this folder.
target.outputDir=../../../tmp/java-runtime/data

# Full TMF canonical schema. The runtime loads all tables into every target DB
# even though milestone 1 only populates TC_PARTY.
target.schema=../../../metadata/tmf.sql

# Delete existing per-party target DB files before recreating them.
target.overwrite=true

# Reverse round-trip test output. The reverse runtime reconstructs only mapped
# source columns plus deterministic/default values required by source schemas.
reverse.outputDir=../../../tmp/java-runtime/reverse-sources
reverse.report=../../../tmp/java-runtime/reverse-compare.json
reverse.siebel.schema=../../../metadata/siebel_ddl.sql
reverse.bscs.schema=../../../metadata/bscs_ddl.sql
reverse.ncc.schema=../../../metadata/ncc_ddl.sql

# Limit instance count for smoke testing. Empty or <= 0 means no limit.
runtime.maxInstances=
